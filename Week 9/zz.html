<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderGo</title>
  <link rel="stylesheet" href="zz.css">
</head>
<body>

  <header class="main-header">
    <nav class="navbar">
      <div class="logo">WanderGo</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#trips">Trips</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="grid-container">
    

    <section class="hero-section">
      <h1 class="hero-title">Plan your next trip in minutes</h1>
      <p class="hero-subtitle">Simple, cheap and fun travel plans.</p>
      <div class="hero-image-container">
   
        <img src="img/hero.jpg" alt="img/hero.jpg" class="hero-image" onerror="this.style.display='none'; this.parentNode.classList.add('placeholder-fallback');">
      </div>
    </section>

    <section class="features-section">
      <div class="feature-card">Easy Booking</div>
      <div class="feature-card">Best Prices</div>
      <div class="feature-card">24x7 Help</div>
    </section>

  </main>

</body>
</html>
